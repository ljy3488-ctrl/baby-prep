<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>우리 아기 준비 현황</title><link rel="stylesheet" href="style.css" defer></head><body><main class="wrap"><header><div class="eyebrow">BABY PREP · 2027.02</div><h1>우리 아기 준비 현황 🍼</h1><p>하나씩 준비하는 우리 아기의 첫 물건들</p></header><div class="notice">현재는 화면 테스트 버전입니다. Google Sheets 동기화는 다음 단계에서 연결합니다.</div><section class="stats"><div class="stat"><small>준비 완료</small><strong id="progress">0 / 42</strong><div class="track"><div id="bar"></div></div></div><div class="stat"><small>실제 구매 금액</small><strong id="spent">0원</strong><span>입력한 금액 합계</span></div></section><section class="controls"><input id="search" type="search" placeholder="준비물 검색" aria-label="준비물 검색"><div class="filters"><select id="category" aria-label="카테고리"><option value="">전체 카테고리</option></select><select id="status" aria-label="구매 상태"><option value="">전체 상태</option><option>미구매</option><option>구매완료</option><option>선물받음</option><option>보류</option></select></div></section><div class="section-title"><h2>준비물 목록</h2><span id="count"></span></div><div id="items" class="items"></div><footer>임시 테스트 데이터 · 실제 공유는 연동 후 활성화됩니다.</footer></main><dialog id="editor"><form method="dialog" id="editForm"><div class="dialog-head"><h2 id="editTitle"></h2><button value="cancel" class="close" aria-label="닫기">✕</button></div><label>구매 상태<select id="editStatus"><option>미구매</option><option>구매완료</option><option>선물받음</option><option>보류</option></select></label><label>실제 구매 금액 (원)<input id="editPrice" type="number" min="0" inputmode="numeric"></label><label>구매 제품<input id="editProduct" maxlength="500" placeholder="제품명 또는 구매처"></label><label>메모<textarea id="editMemo" maxlength="500" rows="3" placeholder="사이즈, 구매 예정일 등"></textarea></label><button class="save" id="saveBtn" value="save">저장</button></form></dialog><script src="app.js" defer></script></body></html>
